<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260">
  <!-- Laurier B: outline + very light fill -->
  <rect width="240" height="260" fill="#102619"/>
  <defs>
    <g id="leaf-b">
      <path d="M0 0 C2.2 -3.2 5.5 -4.2 8.2 -2.2 C5.8 -0.2 2.8 0.6 0 0 Z"
            fill="#d4a84b" fill-opacity=".06" stroke="#d4a84b" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <g id="arm-b">
      <use href="#leaf-b" transform="translate(-4 -34) rotate(-12)"/>
      <use href="#leaf-b" transform="translate(-10 -26) rotate(-2)"/>
      <use href="#leaf-b" transform="translate(-14 -17) rotate(10)"/>
      <use href="#leaf-b" transform="translate(-16 -7) rotate(22)"/>
      <use href="#leaf-b" transform="translate(-15 3) rotate(34)"/>
      <use href="#leaf-b" transform="translate(-12 12) rotate(46)"/>
      <use href="#leaf-b" transform="translate(-7 20) rotate(58)"/>
    </g>
    <g id="wreath-b" opacity=".4">
      <use href="#arm-b"/>
      <use href="#arm-b" transform="scale(-1 1)"/>
      <path d="M-5 24 Q0 29 5 24" fill="none" stroke="#d4a84b" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M-8 26 L-13 32 M8 26 L13 32" fill="none" stroke="#d4a84b" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <use href="#wreath-b" transform="translate(60 58)"/>
  <use href="#wreath-b" transform="translate(180 58)"/>
  <use href="#wreath-b" transform="translate(120 148)"/>
  <use href="#wreath-b" transform="translate(60 238)"/>
  <use href="#wreath-b" transform="translate(180 238)"/>
</svg>
