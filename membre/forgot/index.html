<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>Mot de passe oublié — Grands arrêts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../site.css">
</head>
<body>
<main class="site-main narrow">
  <p class="site-crumb">
    <a href="../../">Droit public et administratif</a>
    <span class="sep">›</span>
    <a href="../">Espace pédagogique</a>
    <span class="sep">›</span>
    <strong>Mot de passe oublié</strong>
  </p>
  <h1 class="site-title">Mot de passe oublié</h1>
  <p class="site-lead">Entrez l’e-mail utilisé lors de l’abonnement : vous recevrez un lien de réinitialisation valable 1 heure.</p>
  <div class="site-panel">
    <form id="f">
      <label class="field" for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email">
      <button class="btn block" type="submit" style="margin-top:1rem">Envoyer le lien</button>
    </form>
    <div class="site-note" id="msg"></div>
    <p class="site-note hidden" id="help">
      Si vous ne recevez pas l’e-mail de réinitialisation,
      <a id="help-mail" href="mailto:cab.pechard@gmail.com">cliquez ici</a>.
    </p>
    <div class="form-links"><a href="../">Retour connexion</a></div>
  </div>
</main>
<script src="../../auth.js?v=5"></script>
<script src="../../site-nav.js?v=43"></script>
<script>
(function () {
  const help = document.getElementById("help");
  const helpMail = document.getElementById("help-mail");
  const contactHref = function (email) {
    return "mailto:cab.pechard@gmail.com"
      + "?subject=" + encodeURIComponent("Mot de passe oublié — espace pédagogique")
      + "&body=" + encodeURIComponent(
        "Bonjour,\n\nJe n’ai pas reçu l’e-mail de réinitialisation de mot de passe.\n\nE-mail du compte : "
        + (email || "")
        + "\n\nMerci."
      );
  };
  helpMail.href = contactHref("");

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const email = document.getElementById("email").value.trim();
    helpMail.href = contactHref(email);
    msg.className = "site-note";
    msg.textContent = "Envoi…";
    help.classList.add("hidden");
    try {
      const data = await FLIPCARDS_AUTH.api("/api/forgot", {
        method: "POST",
        body: {
          email,
          origin: location.origin,
          reset_url: new URL("../reset/", location.href).href,
        },
      });
      msg.className = "site-note ok";
      msg.textContent = data.message || "Si un compte existe, un e-mail de réinitialisation a été envoyé.";
      help.classList.remove("hidden");
    } catch (ex) {
      msg.className = "site-note err";
      msg.textContent = ex.message || "Erreur";
      help.classList.remove("hidden");
    }
  });
})();
</script>
</body>
</html>
