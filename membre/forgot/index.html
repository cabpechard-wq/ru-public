<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>Mot de passe oublié — Grands arrêts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../site.css">
</head>
<body>
<main class="site-main narrow">
  <p class="site-crumb">
    <a href="../../">Droit public et administratif</a>
    <span class="sep">›</span>
    <a href="../">Espace pédagogique</a>
    <span class="sep">›</span>
    <strong>Mot de passe oublié</strong>
  </p>
  <h1 class="site-title">Mot de passe oublié</h1>
  <p class="site-lead">Entre l’e-mail utilisé lors du paiement. Si un compte existe, un lien de réinitialisation (valable 1&nbsp;h) est envoyé. Pense à vérifier les indésirables.</p>
  <div class="site-panel">
    <form id="f">
      <label class="field" for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email">
      <button class="btn block" type="submit" style="margin-top:1rem">Envoyer le lien</button>
    </form>
    <div class="site-note" id="msg"></div>
    <div class="form-links"><a href="../">Retour connexion</a></div>
  </div>
</main>
<script src="../../auth.js?v=5"></script>
<script src="../../site-nav.js?v=34"></script>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "site-note";
  msg.textContent = "Envoi…";
  try {
    const data = await FLIPCARDS_AUTH.api("/api/forgot", {
      method: "POST",
      body: {
        email: document.getElementById("email").value.trim(),
        origin: location.origin,
        reset_url: new URL("../reset/", location.href).href,
      },
    });
    msg.className = "site-note ok";
    msg.textContent = (data.message || "Si un compte existe, un e-mail de réinitialisation a été envoyé.")
      + " Si rien n’arrive, vérifie les indésirables, ou écris à cab.pechard@gmail.com.";
  } catch (ex) {
    msg.className = "site-note err";
    msg.textContent = ex.message || "Erreur";
  }
});
</script>
</body>
</html>
